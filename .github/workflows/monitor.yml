name: Price monitor

on:
  # 04:00 UTC = 07:00 за Києвом влітку (взимку — 06:00)
  schedule:
    - cron: "0 4 * * *"
  # кнопка ручного запуску у вкладці Actions
  workflow_dispatch:

# дозвіл записувати в репозиторій — потрібен, щоб зберігати пам'ять монітора
permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run.py

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshot.json history.csv
          if git diff --staged --quiet; then
            echo "Стан не змінився — коміт не потрібен"
          else
            git commit -m "Update price snapshot $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
